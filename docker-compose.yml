# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ LOCAL DEVELOPMENT ONLY — do NOT deploy this file to production as-is.      │
# │ Override credentials via environment variables or a .env file.              │
# └─────────────────────────────────────────────────────────────────────────────┘
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain}
      POSTGRES_DB: ${POSTGRES_DB:-brain_context}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./internal/store/migrations:/docker-entrypoint-initdb.d

volumes:
  pgdata:
